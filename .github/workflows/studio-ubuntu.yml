name: Ubuntu desktop package
on:
  workflow_dispatch:
  pull_request:
    paths: ['studio/**', 'demo/*.py', '.github/workflows/studio-ubuntu.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: bash studio/scripts/package-ubuntu.sh
      - run: cd studio && npm test && npx tsc --noEmit
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-desktop-amd64
          path: studio/src-tauri/target/release/bundle/deb/*
